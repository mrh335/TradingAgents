[project]
name = "tradingagents-mcp"
version = "0.1.0"
description = "MCP server exposing the TradingAgents webapp + paper trading to Claude Desktop and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",     # official Anthropic MCP Python SDK
    "httpx>=0.27",    # async HTTP client for the webapp
    "yfinance>=0.2",  # live quotes (same source the webapp uses)
]

[project.scripts]
tradingagents-mcp = "tradingagents_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagents_mcp"]
